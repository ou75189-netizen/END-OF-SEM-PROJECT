<!DOCTYPE html>
<html>
<head>
  <title>Invoice</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="company">
  <img src="assets/logo.png" class="logo">
  <h2>Northwest Interiors</h2>
  <p>TIN: 751385271</p>
</div>

<p>Invoice No: <span id="invoiceNo"></span></p>

<input type="text" id="client" placeholder="Client Name">

<table id="items">
<thead>
<tr>
  <th>Description</th>
  <th>Quantity</th>
  <th>Price</th>
  <th>Total</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button onclick="addItem()">Add Item</button>

<input type="number" id="discount" value="0" oninput="calculate()">

<p>Sub-Total: <span id="subtotal">0</span></p>
<p>VAT (18%): <span id="vat">0</span></p>
<p>Total: <span id="total">0</span></p>

<button onclick="saveDocument('invoice')">Save</button>
<button onclick="downloadPDF()">Download PDF</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/app.js"></script>
<script src="js/invoice.js"></script>

</body>
</html>
